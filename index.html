<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 모델 전시관</title>
  
  <!-- CSS 스타일 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
    }

    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    #model-select {
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: rgba(30, 30, 30, 0.85);
      color: #fff;
      backdrop-filter: blur(5px);
      outline: none;
      cursor: pointer;
    }
  </style>

  <!-- Import Map: Three.js 라이브러리 불러오기 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- UI 드롭다운 -->
  <div id="ui-container">
    <select id="model-select">
      <!-- models 폴더 내의 실제 파일명으로 수정해줘 -->
      <option value="models/gfvkqetyf3ii.gltf">2번 역</option>
      <option value="models/RoundTurnel.glb">둥근 터널</option>
      <option value="models/SquareTurnel.glb">사각 터널</option>
      <option value="models/Station101.gltf">1번 역</option>
    </select>
  </div>

  <!-- 3D 화면 영역 -->
  <div id="canvas-container"></div>

  <!-- 자바스크립트 코드를 맨 아래(body 닫히기 직전)에 위치 -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Scene, Camera, Renderer 초기화
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(
      45, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    camera.position.set(0, 2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 2. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
    directionalLight.position.set(5, 10, 7.5);
    scene.add(directionalLight);

    // 3. 마우스/터치 컨트롤
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 4. 모델 로드 함수
    const loader = new GLTFLoader();
    let currentModel = null;

    function loadModel(filePath) {
      if (currentModel) {
        scene.remove(currentModel);
      }

      loader.load(
        filePath,
        (gltf) => {
          currentModel = gltf.scene;
          scene.add(currentModel);
        },
        (xhr) => {
          console.log((xhr.loaded / xhr.total * 100) + '% 완료');
        },
        (error) => {
          console.error('모델 로드 실패:', error);
        }
      );
    }

    // 5. 드롭다운 이벤트 연결
    const selectElement = document.getElementById('model-select');
    selectElement.addEventListener('change', (e) => {
      loadModel(e.target.value);
    });

    // 초기 모델 로드
    loadModel(selectElement.value);

    // 6. 창 크기 조절 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
